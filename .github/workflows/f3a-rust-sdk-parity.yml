  desktop_release_native_inventory_canary:
    name: DESKTOP_RELEASE_NATIVE_INVENTORY_CANARY
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/f3a-rust-sdk-parity' && inputs.desktop_release_native_inventory_canary
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.88.0-x86_64-pc-windows-msvc
    steps:
      - name: Reject conflicting modes
        shell: pwsh
        run: |
          if ('${{ inputs.real_helper_fixed_path_canary }}' -eq 'true' -or '${{ inputs.release_helper_native_inventory_canary }}' -eq 'true' -or '${{ inputs.desktop_lock_byte_identity_only }}' -eq 'true' -or '${{ inputs.desktop_helper_msrv_diagnostic }}' -eq 'true') { throw 'CONFLICTING_DESKTOP_INVENTORY_MODES' }

      - name: Check out exact Desktop inventory HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up standard-library-only CI evidence interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: A - Preflight and canonical locks
        id: desktop_preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $stateDir = Join-Path '${{ runner.temp }}' 'desktop-inventory-${{ github.run_id }}-${{ github.run_attempt }}'
          if (Test-Path -LiteralPath $stateDir) { throw 'INVENTORY_STATE_ALREADY_EXISTS' }
          [void](New-Item -ItemType Directory -Path $stateDir)
          $env:DESKTOP_INVENTORY_STATE_DIR = $stateDir
          $env:CARGO_TARGET_DIR = Join-Path '${{ runner.temp }}' 'desktop-release-native-target'
          @("DESKTOP_INVENTORY_STATE_DIR=$stateDir", "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR") >> $env:GITHUB_ENV
          $locks = @{
            'desktop/Cargo.lock' = @('cbfdaabcaea09497feba169e934af93941678c3e', 'd628a85387556da8542551fad508f0f7bd4b92f570e49e7b035f3f765ddc5069')
            'tools/f3a-rust-sdk-parity/Cargo.lock' = @('634efc02b8059623d08913dfe8ab354efc8c3187', 'a40f49659e9329689de6aa1bf581875a9e2b542e5d0faca6c33f4964fe03f3a8')
          }
          if ((git rev-parse HEAD) -ne '${{ github.sha }}' -or $LASTEXITCODE -ne 0) { throw 'CHECKOUT_HEAD_MISMATCH' }
          'SOURCE_HEAD_MATCH: true'
          $indexPath = (git rev-parse --git-path index).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'INDEX_PATH_UNAVAILABLE' }
          $indexBefore = (Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash
          "index_sha=$indexBefore" >> $env:GITHUB_OUTPUT
          $state = @{schemaVersion=1; sourceHead='${{ github.sha }}'; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; data=@{indexSha=$indexBefore}}
          [IO.File]::WriteAllText((Join-Path $stateDir 'preflight.json'), ($state | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          function Read-RawBlob([string]$oid) {
            $start = [Diagnostics.ProcessStartInfo]::new('git')
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.ArgumentList.Add('cat-file'); $start.ArgumentList.Add('blob'); $start.ArgumentList.Add($oid)
            $p = [Diagnostics.Process]::Start($start)
            $memory = [IO.MemoryStream]::new()
            try {
              $p.StandardOutput.BaseStream.CopyTo($memory); $p.WaitForExit()
              if ($p.ExitCode -ne 0) { throw 'RAW_LOCK_READ_FAILED' }
              return ,$memory.ToArray()
            } finally { $memory.Dispose(); $p.Dispose() }
          }
          function Assert-DesktopLock([string]$stage, [bool]$materialize = $false) {
            foreach ($path in @('desktop/Cargo.lock', 'tools/f3a-rust-sdk-parity/Cargo.lock')) {
            $expectedOid = $locks[$path][0]; $expectedSha = $locks[$path][1]
            $oid = (git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $oid -ne $expectedOid) { throw 'LOCK_BLOB_OID_MISMATCH' }
            $raw = Read-RawBlob $oid
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($raw)).ToLowerInvariant()
            if ($sha -ne $expectedSha) { throw 'CANONICAL_LOCK_HASH_MISMATCH' }
            if ($materialize) { [IO.File]::WriteAllBytes((Join-Path $PWD $path), $raw) }
            $working = [IO.File]::ReadAllBytes((Join-Path $PWD $path))
            $workingSha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($working)).ToLowerInvariant()
            if (-not [Collections.StructuralComparisons]::StructuralEqualityComparer.Equals($raw, $working) -or $workingSha -ne $expectedSha) { throw 'WORKING_LOCK_BYTES_CHANGED' }
            if ((Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash -ne $indexBefore) { throw 'INDEX_CHANGED' }
            "LOCK_EVIDENCE: stage=$stage path=$path blob=$oid bytes=$($raw.Length) sha256=$sha raw_bytes_equal=true index_unchanged=true"
            }
          }
          Assert-DesktopLock 'initial-materialization' $true

      - name: B - Pinned toolchain and source identity
        id: desktop_toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'OFFICIAL_TOOLCHAIN_INSTALL_FAILED' }
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os, re, shutil, subprocess, sys, tomllib
          from pathlib import Path
          from scripts.inspect_f3a_release_helper import PE, emit, sha, VC_RUNTIME
          def read_state(name):
              raw = (Path(os.environ['DESKTOP_INVENTORY_STATE_DIR'])/(name+'.json')).read_bytes()
              if len(raw)>1048576: raise ValueError('INVENTORY_STATE_TOO_LARGE')
              value = json.loads(raw)
              if set(value)!={'schemaVersion','sourceHead','runId','runAttempt','data'} or value['schemaVersion']!=1 or value['sourceHead']!=os.environ['GITHUB_SHA'] or value['runId']!=os.environ['GITHUB_RUN_ID'] or value['runAttempt']!=os.environ['GITHUB_RUN_ATTEMPT']:
                  raise ValueError('INVENTORY_STATE_BINDING_MISMATCH')
              return value['data']
          def write_state(name,data):
              value = dict(schemaVersion=1,sourceHead=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],data=data)
              raw = json.dumps(value,sort_keys=True,separators=(',',':')).encode('utf-8')
              if len(raw)>1048576: raise ValueError('INVENTORY_STATE_TOO_LARGE')
              with (Path(os.environ['DESKTOP_INVENTORY_STATE_DIR'])/(name+'.json')).open('xb') as out:
                  out.write(raw)
          def main():
              root = Path.cwd()
              manifest = tomllib.loads((root / 'desktop/Cargo.toml').read_text(encoding='utf-8'))
              config = json.loads((root / 'desktop/tauri.conf.json').read_text(encoding='utf-8'))
              if manifest['package']['rust-version'] != '1.88' or manifest['package']['edition'] != '2021' or manifest['features']['default'] != [] or config['bundle']['active'] is not False:
                  raise ValueError('DESKTOP_BUILD_CONTRACT_MISMATCH')
              blocked = {'ICU4X_DATA_DIR','RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTC','RUSTDOC','RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER','RUSTC_BOOTSTRAP','RUSTC_LOG','RUSTC_STAGE','CL','_CL_','LINK','_LINK_','CARGO_BUILD_RUSTFLAGS','CARGO_BUILD_TARGET','CARGO_INCREMENTAL','CARGO_BUILD_INCREMENTAL','CARGO_BUILD_RUSTC','CARGO_BUILD_RUSTC_WRAPPER','CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER'}
              overrides = sorted(k for k in os.environ if k in blocked or k.startswith('CARGO_PROFILE_') or (k.startswith('CARGO_TARGET_') and k.endswith(('_LINKER','_RUSTFLAGS'))))
              homes = [Path(os.environ.get('CARGO_HOME', str(Path.home()/'.cargo'))), root/'desktop/.cargo'] + [p/'.cargo' for p in [root,*root.parents]]
              config_present = any((p/n).is_file() for p in homes for n in ('config','config.toml'))
              emit('DESKTOP_BUILD_ENVIRONMENT', dict(unexpectedOverrideNames=overrides, cargoConfigurationPresent=config_present, ICU4X_DATA_DIR='UNSET' if 'ICU4X_DATA_DIR' not in os.environ else 'PRESENT', addedCodegenFlags=[], diagnosticOnlyFlag='RUSTC_LOG=rustc_codegen_ssa::back::link=info'))
              if overrides or config_present:
                  raise ValueError('UNCONTROLLED_BUILD_ENVIRONMENT')
              def checked(role, query, raw=False):
                  tool = Path(shutil.which(query[0]) or query[0]).name
                  emit('TOOL_QUERY_STAGE', dict(role=role,tool=tool,state='STARTED'))
                  try:
                      p = subprocess.run(query, capture_output=True, timeout=30)
                  except (subprocess.TimeoutExpired,OSError) as error:
                      emit('TOOL_QUERY_FAILURE', dict(role=role,tool=tool,exitCode=None,stdoutBytes=len(getattr(error,'stdout',None) or b''),stderrBytes=len(getattr(error,'stderr',None) or b'')))
                      raise ValueError('TOOL_QUERY_DID_NOT_COMPLETE') from None
                  facts = dict(role=role,tool=tool,exitCode=p.returncode,stdoutBytes=len(p.stdout),stderrBytes=len(p.stderr))
                  if len(p.stdout)>131072 or len(p.stderr)>131072 or p.returncode!=0:
                      emit('TOOL_QUERY_FAILURE', facts)
                      raise ValueError('TOOL_QUERY_REJECTED')
                  emit('TOOL_QUERY_RESULT', dict(**facts,state='ACCEPTED'))
                  return p.stdout if raw else (p.stdout+b'\n'+p.stderr).decode('utf-8','replace').strip()
              source_head = checked('source-head',['git','rev-parse','HEAD'])
              if re.fullmatch(r'[0-9a-f]{40}',source_head) is None or source_head!=os.environ['GITHUB_SHA']:
                  raise ValueError('SOURCE_HEAD_MISMATCH')
              emit('SOURCE_HEAD_MATCH',True)
              rust, cargo = checked('rustc-identity',['rustc','-vV']), checked('cargo-identity',['cargo','-vV'])
              if not rust.startswith('rustc 1.88.0 ') or not cargo.startswith('cargo 1.88.0 '):
                  raise ValueError('TOOLCHAIN_MISMATCH')
              rust_fields = [s for s in rust.splitlines() if re.fullmatch(r'(?:rustc |binary: |commit-hash: |commit-date: |host: |release: |LLVM version: )[A-Za-z0-9 .()_-]+',s)]
              cargo_fields = [s for s in cargo.splitlines() if re.fullmatch(r'(?:cargo |release: |commit-hash: |commit-date: |host: |libgit2: |libcurl: |ssl: |os: )[A-Za-z0-9 .(),:_+-]+',s)]
              write_state('toolchain',dict(sourceCommit=source_head,rustc=rust_fields,cargo=cargo_fields,host=next((s.split(': ',1)[1] for s in rust_fields if s.startswith('host: ')),'UNPROVEN')))
          try: main()
          except Exception as error:
              code = str(error) if isinstance(error,ValueError) and re.fullmatch("[A-Z0-9_]+",str(error)) else type(error).__name__
              emit("DESKTOP_EVIDENCE_FAILURE",dict(code=code)); sys.exit(1)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'DESKTOP_INVENTORY_STEP_FAILED' }

      - name: C - Frozen dependency fetch
        id: desktop_fetch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
