      - name: Prove canonical compiled digest and copied-package native preflight
        id: limited_binding
        shell: pwsh
        env:
          RUSTFLAGS: --cfg shirushi_real_helper_canary --cfg shirushi_dev_limited_inspection_canary
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:RUNNER_TEMP 'v02-development-assembly-evidence'
          $a = Join-Path $evidence 'package-a'
          $repeated = Join-Path $evidence 'package-b'
          $moved = Join-Path $env:RUNNER_TEMP 'v02-development-moved-package-b'
          $trusted = Get-Item -LiteralPath $env:SHIRUSHI_CANARY_TRUSTED_MANIFEST
          if ($trusted.PSIsContainer -or ($trusted.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $trusted.Length -gt 4096) { throw 'PREBUILD_MANIFEST_NOT_BOUNDED_REGULAR' }
          $raw = [IO.File]::ReadAllBytes($trusted.FullName)
          if ((Get-FileHash -LiteralPath $trusted.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SHIRUSHI_DEV_INSPECTION_MANIFEST_SHA256) { throw 'COMPILED_DIGEST_INPUT_CHANGED' }
          foreach ($root in @($a,$repeated)) {
            $manifest = Join-Path $root 'inspection-helper.manifest.json'
            $file = Get-Item -LiteralPath $manifest
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 4096) { throw 'PACKAGE_MANIFEST_NOT_BOUNDED_REGULAR' }
            if (-not [Collections.StructuralComparisons]::StructuralEqualityComparer.Equals($raw,[IO.File]::ReadAllBytes($manifest))) { throw 'PREBUILD_PACKAGED_RAW_MANIFEST_DIFFERS' }
          }
          'PREBUILD_PACKAGE_MANIFEST_RAW_BYTES: BOTH_ASSEMBLIES_EXACTLY_EQUAL'
          if (Test-Path -LiteralPath $moved) { throw 'MOVED_PACKAGE_ALREADY_EXISTS' }
          New-Item -ItemType Directory -Path $moved -ErrorAction Stop | Out-Null
          foreach ($name in @('shirushi-desktop.exe','shirushi-inspection-helper.exe','inspection-helper.manifest.json')) {
            $source = Join-Path $a $name
            $file = Get-Item -LiteralPath $source
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -gt 268435456) { throw 'PACKAGE_COPY_NOT_REGULAR_BOUNDED' }
            Copy-Item -LiteralPath $source -Destination (Join-Path $moved $name) -ErrorAction Stop
            if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath (Join-Path $moved $name) -Algorithm SHA256).Hash) { throw 'MOVED_PACKAGE_COPY_DIFFERS' }
          }
          $env:SHIRUSHI_CANARY_PACKAGE_A = $a
          $env:SHIRUSHI_CANARY_PACKAGE_B = $moved
          $log = Join-Path $env:RUNNER_TEMP 'limited-moved-package-control.log'
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --test limited_inspection real_assembled_package_move_preflight -- --ignored --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { exit $nativeExit }
          if ((Get-Item -LiteralPath $log).Length -gt 2097152) { throw 'MOVED_PACKAGE_CONTROL_TOO_LARGE' }
          $control = [IO.File]::ReadAllText($log)
          if ($control -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;' -or $control -notmatch 'REAL_MOVED_PACKAGE_PREFLIGHT: BOTH_ROOTS_PASS; COMPILED_RAW_DIGEST_MATCH; HELPER_IDENTITY_MATCH; NO_UI_LAUNCH') { throw 'MOVED_PACKAGE_NATIVE_TEST_NOT_EXECUTED' }
          if ((Get-FileHash -LiteralPath $trusted.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SHIRUSHI_DEV_INSPECTION_MANIFEST_SHA256) { throw 'FINAL_TRUSTED_DIGEST_CHANGED' }
          'DEVELOPMENT_EXECUTABLE_RELATIVE_BINDING: COMPILED_DIGEST_AND_BOTH_ROOTS_PROVEN; UI_NOT_LAUNCHED'

      - name: Observe selected MSVC toolsets for the approved deployment floor
