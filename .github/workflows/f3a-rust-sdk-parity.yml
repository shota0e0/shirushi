name: F3A isolated Rust SDK semantic parity PoC

on:
  push:
    branches: [codex/f3a-rust-sdk-parity, codex/limited-inspection-native-validation]
    paths:
      - tools/f3a-rust-sdk-parity/**
      - docs/development/f3a-rust-sdk-parity*
      - .github/workflows/f3a-rust-sdk-parity.yml
      - desktop/src/limited_inspection.rs
      - desktop/src/inspection_supervisor.rs
      - desktop/src/explorer_entry.rs
      - scripts/explorer_context_v02.py
      - tests/test_explorer_context_v02.py
      - desktop/src/lib.rs
      - desktop/tests/limited_inspection.rs
  workflow_dispatch:
    inputs:
      real_helper_fixed_path_canary:
        description: CI-only real helper fixed-path identity Canary; artifact upload 0
        type: boolean
        default: false
      release_helper_native_inventory_canary:
        description: CI-only default-release helper and bounded native inventory; artifact upload 0
        type: boolean
        default: false
      desktop_lock_byte_identity_only:
        description: Diagnose frozen Desktop lock checkout bytes only; no Cargo or artifacts
        type: boolean
        default: false
      desktop_helper_msrv_diagnostic:
        description: Windows locked Desktop 1.77/1.88 and helper 1.88 compatibility; artifact upload 0
        type: boolean
        default: false
      desktop_release_native_inventory_canary:
        description: CI-only Desktop default release static PE/native inventory; no launch or artifacts
        type: boolean
        default: false
      limited_inspection_native_validation:
        description: Temporary-branch Rust 1.88 development Limited Inspection native tests; artifact upload 0
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: f3a-isolated-sdk-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  limited_inspection_native_validation:
    name: LIMITED_INSPECTION_NATIVE_VALIDATION
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/limited-inspection-native-validation'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.88.0-x86_64-pc-windows-msvc
    steps:
      - name: Check out exact temporary validation commit without EOL conversion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exclusive mode, canonical inputs and initial index
        id: limited_preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $other = @('${{ inputs.real_helper_fixed_path_canary }}', '${{ inputs.release_helper_native_inventory_canary }}', '${{ inputs.desktop_lock_byte_identity_only }}', '${{ inputs.desktop_helper_msrv_diagnostic }}', '${{ inputs.desktop_release_native_inventory_canary }}')
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'limited-inspection-native-target')" >> $env:GITHUB_ENV
          if (@($other | Where-Object { $_ -eq 'true' }).Count) { throw 'CONFLICTING_VALIDATION_MODES' }
          if ($env:GITHUB_REF -ne 'refs/heads/codex/limited-inspection-native-validation') { throw 'VALIDATION_BRANCH_MISMATCH' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'SOURCE_HEAD_MISMATCH' }
          $index = (git rev-parse --git-path index).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'INDEX_PATH_UNAVAILABLE' }
          $indexSha = (Get-FileHash -LiteralPath $index -Algorithm SHA256).Hash.ToLowerInvariant()
          "LIMITED_NATIVE_INDEX_SHA=$indexSha" >> $env:GITHUB_ENV
          "index_sha=$indexSha" >> $env:GITHUB_OUTPUT
          $locks = @{
            'desktop/Cargo.lock' = 'f704b02621c9325d32735d35204438ae91a54ac3662376d709b9a99eb47977e7'
            'tools/f3a-rust-sdk-parity/Cargo.lock' = '5ebd0ac43127f7bf2035fce1ec02ffae890a8acc79bf84066cba1f63da5de9b5'
          }
          foreach ($path in $locks.Keys) {
            $oid = (git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0) { throw 'LOCK_BLOB_UNAVAILABLE' }
            $start = [Diagnostics.ProcessStartInfo]::new('git')
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.ArgumentList.Add('cat-file'); $start.ArgumentList.Add('blob'); $start.ArgumentList.Add($oid)
            $p = [Diagnostics.Process]::Start($start)
            $memory = [IO.MemoryStream]::new()
            try {
              $p.StandardOutput.BaseStream.CopyTo($memory); $p.WaitForExit()
              if ($p.ExitCode -ne 0) { throw 'RAW_LOCK_READ_FAILED' }
              $raw = $memory.ToArray()
            } finally { $memory.Dispose(); $p.Dispose() }
            $working = [IO.File]::ReadAllBytes((Join-Path $PWD $path))
            $rawSha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($raw)).ToLowerInvariant()
            if ($rawSha -ne $locks[$path] -or -not [Collections.StructuralComparisons]::StructuralEqualityComparer.Equals($raw, $working)) { throw 'CANONICAL_LOCK_BYTE_MISMATCH' }
            "LOCK_EVIDENCE: initial path=$path sha256=$rawSha raw_bytes_equal=true"
          }
          $fixture = Get-Item -LiteralPath 'tests/fixtures/inspection/valid_shirushi.png'
          if ($fixture.Length -ne 319495 -or (Get-FileHash -LiteralPath $fixture.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '558c4044228761f91ad1ee1a4637bdd868c65f0e9954e7de928a1262e3076316') { throw 'FIXTURE_CHANGED' }
          if ((Get-FileHash -LiteralPath $index -Algorithm SHA256).Hash.ToLowerInvariant() -ne $indexSha) { throw 'INDEX_CHANGED' }
          'SOURCE_HEAD_MATCH: true'; "INITIAL_INDEX_SHA256: $indexSha"; 'ARTIFACT_UPLOAD_COUNT: 0'

      - name: Install existing regression-test Python only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10

      - name: Assert Rust 1.88 and fetch frozen dependencies
        id: limited_fetch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in @('ICU4X_DATA_DIR','RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTC','RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER','CL','_CL_','LINK','_LINK_')) {
            if (Test-Path "Env:$name") { throw 'UNAPPROVED_BUILD_OVERRIDE' }
          }
          if (@(Get-ChildItem Env: | Where-Object { $_.Name -like 'CARGO_PROFILE_*' -or $_.Name -like 'CARGO_TARGET_*_LINKER' -or $_.Name -like 'CARGO_TARGET_*_RUSTFLAGS' }).Count) { throw 'UNAPPROVED_BUILD_OVERRIDE' }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rust = cargo +1.88.0 --version
          if ($LASTEXITCODE -ne 0 -or -not $rust.StartsWith('cargo 1.88.0 ')) { throw 'CARGO_VERSION_MISMATCH' }
          $compiler = rustc +1.88.0 --version
          if ($LASTEXITCODE -ne 0 -or -not $compiler.StartsWith('rustc 1.88.0 ')) { throw 'RUST_VERSION_MISMATCH' }
          "RUST: $compiler"; "CARGO: $rust"; 'TARGET: x86_64-pc-windows-msvc; PROFILE: default debug'
          cargo +1.88.0 fetch --locked --manifest-path tools/f3a-rust-sdk-parity/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 fetch --locked --manifest-path desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $locks = @{
            'desktop/Cargo.lock' = 'f704b02621c9325d32735d35204438ae91a54ac3662376d709b9a99eb47977e7'
            'tools/f3a-rust-sdk-parity/Cargo.lock' = '5ebd0ac43127f7bf2035fce1ec02ffae890a8acc79bf84066cba1f63da5de9b5'
          }
          foreach ($path in $locks.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $locks[$path]) { throw 'POST_FETCH_LOCK_CHANGED' }
          }
          $index = (git rev-parse --git-path index).Trim()
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $index -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LIMITED_NATIVE_INDEX_SHA) { throw 'POST_FETCH_INDEX_CHANGED' }
          python -I -B -m venv --without-pip .venv-py312
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'LOCK_INDEX_EVIDENCE: after-fetch unchanged; Python only for existing BridgeHost regression fixtures, never inspection fallback'

      - name: Assert SDK footprint and build/test Rust helper
        id: limited_helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $raw = cargo +1.88.0 metadata --locked --offline --format-version 1 --filter-platform x86_64-pc-windows-msvc --manifest-path tools/f3a-rust-sdk-parity/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $raw | ConvertFrom-Json
          $sdk = @($metadata.packages | Where-Object name -EQ 'c2pa')
          if ($sdk.Count -ne 1 -or $sdk[0].version -ne '0.85.0') { throw 'SDK_VERSION_MISMATCH' }
          $features = @(($metadata.resolve.nodes | Where-Object id -EQ $sdk[0].id).features)
          if ($features.Count -ne 1 -or $features[0] -ne 'rust_native_crypto') { throw 'SDK_FEATURE_MISMATCH' }
          $tree = @(cargo +1.88.0 tree --locked --offline --target x86_64-pc-windows-msvc --manifest-path tools/f3a-rust-sdk-parity/Cargo.toml --prefix none --format '{p}' --no-dedupe | Sort-Object -Unique)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $active = @($metadata.packages | Where-Object { $tree -Match ('^'+[regex]::Escape($_.name+' v'+$_.version)+'(?: |$)') })
          $scripts = @($active | Where-Object { @($_.targets | Where-Object kind -Contains 'custom-build').Count })
          if ($tree.Count -ne 248 -or $scripts.Count -ne 26 -or @($active | Where-Object links).Count) { throw 'HELPER_FOOTPRINT_MISMATCH' }
          if (@($active | Where-Object name -Match '^(reqwest|ureq|wstd|openssl|openssl-sys|ring|aws-lc-sys|cc|sha2-asm)$').Count) { throw 'UNAPPROVED_RUNTIME_BACKEND' }
          'HELPER_FEATURES: c2pa0.85.0; rust_native_crypto only; packages248/build scripts26; bounded PNG/JPEG image decoder addition'
          cargo +1.88.0 build --locked --offline --target x86_64-pc-windows-msvc --manifest-path tools/f3a-rust-sdk-parity/Cargo.toml --bin shirushi-inspection-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path tools/f3a-rust-sdk-parity/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze exact development helper input before Desktop compilation
        id: limited_input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/debug/shirushi-inspection-helper.exe'
          $file = Get-Item -LiteralPath $helper
          if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'HELPER_NOT_REGULAR' }
          $size = $file.Length
          $sha = (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant()
          $trusted = Join-Path '${{ runner.temp }}' 'limited-native-trusted-input'
          New-Item -ItemType Directory -Path $trusted -ErrorAction Stop | Out-Null
          $manifest = Join-Path $trusted 'inspection-helper.manifest.json'
          if ((Get-FileHash -LiteralPath 'scripts/package_v02_development.py' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2b62440b5123f117ead8159331a26853ac365cbf7552231184152302872463f6') { throw 'CANONICAL_GENERATOR_CHANGED' }
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $PWD '.venv-py312/Scripts/python.exe'))
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true
          foreach ($arg in @('-B',(Join-Path $PWD 'scripts/package_v02_development.py'),'prepare-manifest','--helper',$helper)) { $start.ArgumentList.Add($arg) }
          $out = [IO.File]::Open($manifest, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          $p = [Diagnostics.Process]::Start($start)
          try {
            $p.StandardOutput.BaseStream.CopyTo($out); $out.Dispose()
            $diagnostic = $p.StandardError.ReadToEnd(); $p.WaitForExit()
            if ($p.ExitCode -ne 0 -or (Get-Item -LiteralPath $manifest).Length -lt 1 -or (Get-Item -LiteralPath $manifest).Length -gt 4096 -or $diagnostic.Length -gt 8192) { throw 'CANONICAL_MANIFEST_PREPARATION_FAILED' }
          } finally { $out.Dispose(); $p.Dispose() }
          $digest = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $helper).Length -ne $size -or (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha -or $diagnostic.Trim() -ne "DEVELOPMENT_MANIFEST_SHA256: $digest") { throw 'CANONICAL_PREBUILD_INPUT_CHANGED' }
          # Only the canonical raw digest authorizes application compilation.
          # Remaining absolute paths below are explicit native TEST fixtures.
          "SHIRUSHI_DEV_INSPECTION_MANIFEST_SHA256=$digest" >> $env:GITHUB_ENV
          "SHIRUSHI_CANARY_TRUSTED_MANIFEST=$manifest" >> $env:GITHUB_ENV
          "SHIRUSHI_CANARY_MANIFEST_SHA256=$digest" >> $env:GITHUB_ENV
          "SHIRUSHI_CANARY_BUILT_HELPER=$helper" >> $env:GITHUB_ENV
          "SHIRUSHI_CANARY_HELPER_SHA256=$sha" >> $env:GITHUB_ENV
          "HELPER_INPUT: size=$size sha256=$sha manifest_sha256=$digest; compile-time trusted inputs only"

      - name: Build Desktop and run default library/supervisor regressions
        id: limited_desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo +1.88.0 build --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --bin shirushi-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --lib -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --test inspection_supervisor -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --features manual-canary --test inspection_supervisor -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run accepted helper identity and new application-dispatch native tests
        id: limited_real
        shell: pwsh
        env:
          RUSTFLAGS: --cfg shirushi_real_helper_canary --cfg shirushi_dev_limited_inspection_canary
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --test real_inspection_helper -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Join-Path '${{ runner.temp }}' 'limited-native-test-control.log'
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --test limited_inspection -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { exit $nativeExit }
          # Explicitly reject cfg-gated zero-test success. Runner-local log only;
          # no upload/transport, no application launch or package production.
          if ((Get-Item -LiteralPath $log).Length -gt 2097152) { throw 'LIMITED_TEST_CONTROL_TOO_LARGE' }
          $control = [IO.File]::ReadAllText($log)
          if ($control -notmatch 'test result: ok\. 6 passed; 0 failed; 1 ignored;' -or $control -notmatch 'application_dispatch_fixture_success_cleanup_and_sequential_repetition' -or $control -notmatch 'application_dispatch_failure_then_success_preserves_source' -or $control -notmatch 'development_resolver_raw_manifest_and_helper_tamper_fail_closed') { throw 'LIMITED_NATIVE_TESTS_NOT_EXECUTED' }
          'LIMITED_NATIVE_APPLICATION_TESTS: 2 dispatch + 4 focused resolver passed; 1 explicit post-assembly test pending'

      - name: Validate real Product Flow controller Add and limited inspection roundtrips
        id: product_native
        shell: pwsh
        env:
          RUSTFLAGS: --cfg shirushi_real_helper_canary --cfg shirushi_dev_limited_inspection_canary
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'product-native-roundtrip.log'
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --lib product_operation::tests::native_controller_png_jpeg_add_inspect_roundtrip_and_fail_closed_publication -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { exit $nativeExit }
          if ((Get-Item -LiteralPath $log).Length -gt 2097152) { throw 'PRODUCT_NATIVE_CONTROL_TOO_LARGE' }
          $control = [IO.File]::ReadAllText($log)
          if ($control -notmatch 'test result: ok\. 1 passed; 0 failed;' -or $control -notmatch 'PRODUCT_NATIVE_CONTROLLER_ROUNDTRIP: format=png' -or $control -notmatch 'PRODUCT_NATIVE_CONTROLLER_ROUNDTRIP: format=jpg' -or $control -notmatch 'reaped=true jobActiveProcesses=Some\(0\)') { throw 'PRODUCT_NATIVE_ROUNDTRIPS_NOT_EXECUTED' }
          'PRODUCT_NATIVE_ROUNDTRIP: PNG_AND_JPEG_PASS; NO_SOURCE_OVERWRITE; PERSONAL_MARK_METADATA_ONLY; LIMITED_INCOMPLETE'

      - name: Validate current Product Flow Web contracts without native execution
        id: product_web
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($script in @('web/verify.mjs','web/desktop/verify.mjs','web/desktop/inspection.verify.mjs','web/desktop/limited-inspection.verify.mjs','web/desktop/product-flow.verify.mjs','web/personal-mark-v2/verify.mjs','web/personal-mark-v2/unicode16.verify.mjs','web-canary/verify.mjs')) {
            node $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & .\.venv-py312\Scripts\python.exe -B -m unittest tests.test_inspection_application
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'PRODUCT_WEB_REGRESSIONS: PASS; SYNTHETIC_TRANSPORT_NOT_NATIVE_SMOKE; EXISTING_PYTHON_REGRESSIONS_ONLY'

      - name: Prove Explorer native handoff and isolated registration ownership
        id: explorer_native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'explorer-native-contract.log'
          cargo +1.88.0 test --locked --offline --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml --lib explorer_entry::tests -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $log).Length -gt 2097152) { throw 'EXPLORER_TEST_LOG_BOUND' }
          $control = [IO.File]::ReadAllText($log)
          if ($control -notmatch 'test result: ok\. 12 passed; 0 failed;' -or $control -notmatch 'native_take_reads_png_jpeg_for_both_operations_once' -or $control -notmatch 'native_independent_entries_reject_concurrent_duplicate' -or $control -notmatch 'native_take_rejects_malformed_unsupported_and_mismatched_images') { throw 'EXPLORER_NATIVE_TESTS_NOT_EXECUTED' }
          $env:SHIRUSHI_EXPLORER_REGISTRY_CI = '1'
          $env:SHIRUSHI_EXPLORER_NATIVE_DESKTOP = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/debug/shirushi-desktop.exe'
          $env:SHIRUSHI_EXPLORER_NATIVE_DESKTOP_SHA256 = (Get-FileHash -LiteralPath $env:SHIRUSHI_EXPLORER_NATIVE_DESKTOP -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\.venv-py312\Scripts\python.exe -B -m unittest tests.test_explorer_context_v02 tests.test_desktop_bridge -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'EXPLORER_NATIVE_CONTRACT: 12_RUST_TESTS_PASS; REAL_PNG_JPEG_BOTH_INTENTS; SOURCE_UNCHANGED; ONE_SHOT; DUPLICATE_REJECTED; NO_DESKTOP_UI_LAUNCH'
          'EXPLORER_REGISTRATION_SCOPE: CI_NONCE_HKCU_ONLY; OWNER_PC_UNCHANGED; ACTUAL_EXPLORER_UI_NOT_RUN'

      - name: Assemble and independently audit actual same-job development bytes
        id: limited_package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $frozen = @{
            'scripts/package_v02_development.py' = '2b62440b5123f117ead8159331a26853ac365cbf7552231184152302872463f6'
            'tests/test_package_v02_development.py' = '6395c7c042c2768f88b27aa2517b4e3792ad8b10512ca04dc3b9eca59ae52b1c'
            'docs/development/v02-development-package.md' = 'aa3cfd2e59ee8a8bef2055319a432d661174c0d4a3160429ea7f6b2a8411e84a'
          }
          foreach ($path in $frozen.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $frozen[$path]) { throw 'FROZEN_ASSEMBLER_SOURCE_CHANGED' }
          }
          & .\.venv-py312\Scripts\python.exe -B -m unittest discover -s tests -p test_package_v02_development.py -v
          if ($LASTEXITCODE -ne 0) { throw 'DEVELOPMENT_PACKAGE_UNIT_TESTS_FAILED' }
          @'
          import ctypes, hashlib, json, os, re, shutil, stat, struct, subprocess, sys
          from pathlib import Path
          DESKTOP, HELPER, MANIFEST = 'shirushi-desktop.exe', 'shirushi-inspection-helper.exe', 'inspection-helper.manifest.json'
          NAMES = {DESKTOP, HELPER, MANIFEST}
          LIMIT, REPARSE = 268435456, 0x400
          def require(condition, code):
              if not condition: raise ValueError(code)
          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii')
          def emit(marker, value):
              print(marker + ': ' + canonical(value).decode('ascii'))
          def failure(kind, error, trace):
              code = str(error) if isinstance(error, ValueError) and re.fullmatch('[A-Z0-9_]+', str(error)) else kind.__name__
              emit('DEVELOPMENT_PACKAGE_EVIDENCE_FAILURE', {'code': code})
          sys.excepthook = failure
          require(sys.version_info[:3] == (3, 12, 10), 'PYTHON_VERSION_CHANGED')
          def metadata(path, directory=False):
              value = path.lstat()
              require(not stat.S_ISLNK(value.st_mode) and not getattr(value, 'st_file_attributes', 0) & REPARSE, 'REPARSE_PATH')
              require(stat.S_ISDIR(value.st_mode) if directory else stat.S_ISREG(value.st_mode), 'NOT_REGULAR')
              require(type(value.st_dev) is int and type(value.st_ino) is int and value.st_ino > 0, 'FILE_IDENTITY_UNAVAILABLE')
              return value
          def stamp(value):
