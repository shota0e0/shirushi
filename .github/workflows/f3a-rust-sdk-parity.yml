          if ($LASTEXITCODE -ne 0) { throw 'FROZEN_DESKTOP_FETCH_FAILED' }
          Assert-DesktopLock 'after-frozen-fetch'

      - name: D - Desktop default release build
        id: desktop_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os, re, shutil, subprocess, sys, tomllib
          from pathlib import Path
          from scripts.inspect_f3a_release_helper import PE, emit, sha, VC_RUNTIME
          def read_state(name):
