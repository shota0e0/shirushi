            @('DESKTOP_HELPER_MSRV_DIAGNOSTIC', 'Real helper integration: NOT RUN (optional trusted build-input harness not configured in this diagnostic)', 'Helper1.88: accepted CI36878172530; 88 tests and release build PASS; NOT RERUN', 'Modern 1.97.1: frozen fetch/metadata only; accepted suites remain control, not MSRV proof', 'Parked limited-canary binaries: NOT RUN', 'Package/installer generation: NOT RUN', 'Artifact upload: NOT RUN; ARTIFACT_UPLOAD_COUNT = 0', 'Current declarations: Desktop1.88 / Helper1.88; independent Cargo graphs', 'Production adoption: UNAPPROVED; Distribution Compliance: NOT READY; Full F3A: NOT READY') >> $env:GITHUB_STEP_SUMMARY
