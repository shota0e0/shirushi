              raw = json.dumps(value,sort_keys=True,separators=(',',':')).encode('utf-8')
              if len(raw)>1048576: raise ValueError('INVENTORY_STATE_TOO_LARGE')
              with (Path(os.environ['DESKTOP_INVENTORY_STATE_DIR'])/(name+'.json')).open('xb') as out:
