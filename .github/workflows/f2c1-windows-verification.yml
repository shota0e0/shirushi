name: F2C.1 Windows verification

on:
  workflow_dispatch:
    inputs:
      desktop_inspection_only:
        description: "Desktop inspection adapter Rust tests only; no runtime, package or upload"
        type: boolean
        required: false
        default: false
      desktop_inspection_scope:
        description: "Desktop-only scope; cleanup diagnostic uses frozen source and bounded comparisons"
        type: choice
        required: false
        default: adapter
        options:
          - adapter
          - workspace_cleanup_diagnostic
          - descendant_cleanup_diagnostic
      descendant_isolated_only:
        description: "Descendant diagnostic scope only: exactly one isolated test, never full target"
        type: boolean
        required: false
        default: false
      first_rust_only:
        description: "Run only the F3A first Rust-test gate; no runtime, package or upload"
        type: boolean
        required: false
        default: false
      f3a_runtime_reproduction:
        description: "Independent Candidate B native Limited Inspection proof only; no runtime upload"
        type: boolean
        required: false
        default: false
      f3a_runner_transport:
        description: "Development-only exact runner build; upload ONLY exe and sanitized runner evidence"
        type: boolean
        required: false
        default: false
      f3a_source_identity_only:
        description: "Diagnostic ONLY: raw Git blob versus checkout bytes; no tests/build/upload"
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: f2c1-windows-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop_inspection:
    name: DESKTOP_INSPECTION_ONLY
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_inspection_only == true && github.ref == 'refs/heads/codex/f3a-rust-sdk-parity'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      EVIDENCE_SHA: ${{ inputs.desktop_inspection_scope == 'workspace_cleanup_diagnostic' && '3e9cc6e0c5a1fb537db69ae4107fa37b071dfcb2' || github.sha }}
    steps:
      - name: Reject conflicting bounded modes
        id: mode
        shell: pwsh
        run: |
          if ("${{ inputs.first_rust_only }}" -eq "true" -or "${{ inputs.f3a_runtime_reproduction }}" -eq "true" -or "${{ inputs.f3a_runner_transport }}" -eq "true" -or "${{ inputs.f3a_source_identity_only }}" -eq "true") {
            throw "DESKTOP_INSPECTION_MODE_CONFLICT"
          }
          if ("${{ inputs.descendant_isolated_only }}" -eq "true" -and "${{ inputs.desktop_inspection_scope }}" -ne "descendant_cleanup_diagnostic") {
            throw "DESCENDANT_ISOLATED_SCOPE_REQUIRED"
          }

      - name: Check out exact Desktop test source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.desktop_inspection_scope == 'workspace_cleanup_diagnostic' && '3e9cc6e0c5a1fb537db69ae4107fa37b071dfcb2' || github.sha }}

      - name: Assert exact source and record frozen inputs
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EVIDENCE_SHA) { throw "DESKTOP_SOURCE_IDENTITY_MISMATCH" }
          $paths = @('desktop/Cargo.toml', 'desktop/Cargo.lock', 'tools/f3a-rust-sdk-parity/Cargo.lock', 'tests/fixtures/inspection/valid_shirushi.png')
          $names = @('DESKTOP_TOML_SHA', 'DESKTOP_LOCK_SHA', 'POC_LOCK_SHA', 'FIXTURE_SHA')
          for ($i = 0; $i -lt $paths.Count; $i++) {
            $hash = (Get-FileHash -LiteralPath $paths[$i] -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($names[$i])=$hash" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
          $desktopMsrvPattern = if ("${{ inputs.desktop_inspection_scope }}" -eq 'workspace_cleanup_diagnostic') { '^rust-version = "1\.77"$' } else { '^rust-version = "1\.88"$' }
          if (-not (Select-String -LiteralPath desktop/Cargo.toml -Pattern $desktopMsrvPattern -Quiet)) { throw "DESKTOP_MSRV_MISMATCH" }
          "DESKTOP_INSPECTION_ONLY_TESTED_SHA: $head"

      - name: Set up existing BridgeHost test interpreter only
        id: python_setup
        if: inputs.desktop_inspection_scope == 'adapter'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Create dependency-free BridgeHost fixture environment
        id: bridge_fixture
        if: inputs.desktop_inspection_scope == 'adapter'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = "${{ steps.python_setup.outputs.python-path }}"
          if (-not [IO.Path]::IsPathFullyQualified($python)) { throw "BRIDGE_TEST_PYTHON_IDENTITY_REQUIRED" }
          & $python -I -B -c "import platform,struct; assert platform.python_implementation() == 'CPython' and platform.python_version() == '3.12.10' and struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath .venv-py312) { throw "BRIDGE_TEST_VENV_NOT_FRESH" }
          # Existing Rust BridgeHost fixtures require this exact path. No pip,
          # package installation or F3A Candidate runtime reconstruction occurs.
          & $python -I -B -m venv --without-pip .venv-py312
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv-py312\Scripts\python.exe -I -B -c "import platform,struct; assert platform.python_version() == '3.12.10' and struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and assert existing pinned Windows Rust toolchain
        id: rust_setup
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rust = rustc --version
          if ($LASTEXITCODE -ne 0 -or -not $rust.StartsWith('rustc 1.97.1 ')) { throw "DESKTOP_RUST_IDENTITY_MISMATCH" }
          $cargo = cargo --version
          if ($LASTEXITCODE -ne 0 -or -not $cargo.StartsWith('cargo 1.97.1 ')) { throw "DESKTOP_CARGO_IDENTITY_MISMATCH" }
          "Rust: $rust; Cargo: $cargo"

      - name: Fetch only locked Desktop Rust dependencies
        id: cargo_fetch
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove exact residual-descendant regression before adapter suites
        id: descendant_regression
        if: inputs.desktop_inspection_scope == 'adapter'
        shell: pwsh
        run: |
          cargo test --locked --offline --manifest-path desktop\Cargo.toml --test inspection_supervisor process::descendant_cleanup_failure_supersedes_valid_response -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test inspection-supervisor integration in both configurations
        id: inspection_coverage
        if: inputs.desktop_inspection_scope == 'adapter'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath desktop/tests/inspection_supervisor.rs -PathType Leaf)) {
            throw "INSPECTION_SUPERVISOR_TEST_TARGET_MISSING"
          }
          cargo test --locked --offline --manifest-path desktop\Cargo.toml --test inspection_supervisor -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml --test inspection_supervisor -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Desktop default library regressions including BridgeHost offline
        id: desktop_default
        if: inputs.desktop_inspection_scope == 'adapter'
        shell: pwsh
        run: |
          cargo test --locked --offline --manifest-path desktop\Cargo.toml --lib -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Desktop manual-canary library and Personal Mark regressions offline
        id: desktop_manual
        if: inputs.desktop_inspection_scope == 'adapter'
        shell: pwsh
        run: |
          cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml --lib -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attribute exact descendant cleanup test with at most three executions
        id: descendant_isolated
        if: inputs.desktop_inspection_scope == 'descendant_cleanup_diagnostic'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $maxAttempts = 3
          if ("${{ inputs.descendant_isolated_only }}" -eq "true") { $maxAttempts = 1 }
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            "DESCENDANT_ISOLATED_${attempt}_BEGIN"
            cargo test --locked --offline --manifest-path desktop\Cargo.toml --test inspection_supervisor process::descendant_cleanup_failure_supersedes_valid_response -- --exact --nocapture
            $code = $LASTEXITCODE
            "DESCENDANT_ISOLATED_${attempt}_EXIT: $code"
            "DESCENDANT_ISOLATED_ATTEMPTS=$attempt" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            if ($code -ne 0) { exit $code }
          }

      - name: Run default supervisor target only after all isolated passes
        id: descendant_full
        if: inputs.desktop_inspection_scope == 'descendant_cleanup_diagnostic' && steps.descendant_isolated.outcome == 'success' && inputs.descendant_isolated_only != true
        shell: pwsh
        run: |
          cargo test --locked --offline --manifest-path desktop\Cargo.toml --test inspection_supervisor -- --nocapture
          exit $LASTEXITCODE

      - name: Diagnose exact failed Workspace test serially
        id: cleanup_isolated
        if: inputs.desktop_inspection_scope == 'workspace_cleanup_diagnostic'
        shell: pwsh
        run: |
          if (Test-Path Env:RUST_TEST_THREADS) { throw "UNEXPECTED_TEST_THREAD_OVERRIDE" }
          cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml --bin shirushi-limited-canary runner::tests::partial_reuse_refuses_before_requested_python_is_probed -- --exact --nocapture --test-threads=1
          $code = $LASTEXITCODE
          "WORKSPACE_ISOLATED_SERIAL_EXIT: $code"
          exit $code

      - name: Diagnose full limited-runner test binary serially
        id: cleanup_serial
        if: inputs.desktop_inspection_scope == 'workspace_cleanup_diagnostic'
        shell: pwsh
        run: |
          cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml --bin shirushi-limited-canary -- --nocapture --test-threads=1
          $code = $LASTEXITCODE
          "WORKSPACE_FULL_SERIAL_EXIT: $code"
          exit $code

      - name: Compare three independent normal-parallel limited-runner runs
        id: cleanup_parallel
        if: inputs.desktop_inspection_scope == 'workspace_cleanup_diagnostic' && steps.cleanup_isolated.outcome == 'success' && steps.cleanup_serial.outcome == 'success'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if (Test-Path Env:RUST_TEST_THREADS) { throw "UNEXPECTED_TEST_THREAD_OVERRIDE" }
          $failed = $false
          for ($comparison = 1; $comparison -le 3; $comparison++) {
            "WORKSPACE_PARALLEL_RUN_${comparison}_BEGIN"
            cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml --bin shirushi-limited-canary -- --nocapture
            $code = $LASTEXITCODE
            "WORKSPACE_PARALLEL_RUN_${comparison}_EXIT: $code"
            "WORKSPACE_PARALLEL_${comparison}_EXIT=$code" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            if ($code -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Recheck frozen inputs
        id: preservation
        if: always() && steps.source.outcome == 'success'
        shell: pwsh
        run: |
          $paths = @('desktop/Cargo.toml', 'desktop/Cargo.lock', 'tools/f3a-rust-sdk-parity/Cargo.lock', 'tests/fixtures/inspection/valid_shirushi.png')
          $expected = @($env:DESKTOP_TOML_SHA, $env:DESKTOP_LOCK_SHA, $env:POC_LOCK_SHA, $env:FIXTURE_SHA)
          for ($i = 0; $i -lt $paths.Count; $i++) {
            if ((Get-FileHash -LiteralPath $paths[$i] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$i]) { throw "DESKTOP_FROZEN_INPUT_CHANGED" }
          }
          'ARTIFACT_UPLOAD_COUNT: 0'

      - name: Record bounded Desktop-only result
        if: always()
        shell: pwsh
        run: |
          $requestedTests = 'Requested order: exact residual-descendant regression (default); --test inspection_supervisor (default then manual-canary); Desktop --lib (default then manual-canary). Stop on any failure. Existing BridgeHost/Personal Mark/navigation regressions remain included.'
          $bridgeFixture = 'BridgeHost fixture: dependency-free CPython test venv only; F3A runtime reconstruction = NOT RUN.'
          $parkedTests = 'parked limited-canary binary tests = NOT RUN BY THIS MODE (adapter scope); retained in their dedicated F3A gates.'
          if ('${{ inputs.desktop_inspection_scope }}' -eq 'workspace_cleanup_diagnostic') {
            $requestedTests = 'Requested tests: exact failed test serially; entire limited-runner bin serially; at most three separate normal-parallel full-bin comparisons after serial PASS.'
            $bridgeFixture = 'BridgeHost fixture preparation = NOT RUN; Python runtime reconstruction = NOT RUN.'
            $parkedTests = 'parked limited-canary binary tests = RUN only by this explicitly selected frozen cleanup diagnostic; no allocator or cleanup fix.'
          }
          if ('${{ inputs.desktop_inspection_scope }}' -eq 'descendant_cleanup_diagnostic') {
            $requestedTests = 'Requested tests: exact default descendant cleanup test; at most three total isolated executions, stop on first failure; full default inspection_supervisor once only after all isolated PASS. Manual-canary integration = NOT RUN.'
            $bridgeFixture = 'BridgeHost fixture preparation = NOT RUN; Python runtime reconstruction = NOT RUN.'
            $parkedTests = 'parked limited-canary binary tests = NOT RUN BY THIS DIAGNOSTIC.'
            if ('${{ inputs.descendant_isolated_only }}' -eq 'true') {
              $requestedTests = 'Requested tests: exactly one isolated default descendant diagnostic; no additional attempts. Full inspection_supervisor target and manual-canary integration = NOT RUN.'
            }
          }
          $summary = @(
            '# DESKTOP_INSPECTION_ONLY',
            "Tested SHA: $env:EVIDENCE_SHA",
            "Desktop-only scope: ${{ inputs.desktop_inspection_scope }}",
            $requestedTests,
            "Mode validation: ${{ steps.mode.outcome }}",
            "Exact residual-descendant regression: ${{ steps.descendant_regression.outcome }}",
            "Desktop default tests: ${{ steps.desktop_default.outcome }}",
            "Desktop manual-canary tests: ${{ steps.desktop_manual.outcome }}",
            "Inspection-supervisor integration (default + manual-canary): ${{ steps.inspection_coverage.outcome }}",
            "Descendant isolated diagnostic: ${{ steps.descendant_isolated.outcome }}; executions: $env:DESCENDANT_ISOLATED_ATTEMPTS",
            "Conditional default full supervisor target: ${{ steps.descendant_full.outcome }}",
            "Workspace isolated serial diagnostic: ${{ steps.cleanup_isolated.outcome }}",
            "Workspace full-bin serial diagnostic: ${{ steps.cleanup_serial.outcome }}",
            "Workspace bounded parallel diagnostic: ${{ steps.cleanup_parallel.outcome }}",
            "Parallel comparison exit codes: $env:WORKSPACE_PARALLEL_1_EXIT / $env:WORKSPACE_PARALLEL_2_EXIT / $env:WORKSPACE_PARALLEL_3_EXIT",
            "Frozen-input recheck: ${{ steps.preservation.outcome }}",
            'Missing or skipped inspection-supervisor tests are NOT a PASS.',
            $parkedTests,
            'Cleanup diagnostic does not implement or verify the Desktop adapter. Serial/parallel comparison is not direct pathname-reuse evidence.',
            $bridgeFixture,
            'package generation = NOT RUN',
            'package audit / Prepare equivalence / runner transport / helper transport = NOT RUN',
            'artifact upload = NOT RUN',
            'ARTIFACT_UPLOAD_COUNT: 0',
            'Production adoption UNAPPROVED; Production Signing PARKED; Distribution Compliance NOT READY; Full F3A NOT READY.'
          )
          if ('${{ inputs.desktop_inspection_scope }}' -eq 'descendant_cleanup_diagnostic' -and '${{ inputs.descendant_isolated_only }}' -eq 'true') {
            $isolatedExecution = 'NOT RUN'
            if ($env:DESCENDANT_ISOLATED_ATTEMPTS -eq '1') { $isolatedExecution = 'RUN' }
            $summary += @(
              'descendant_isolated_only = true',
              "isolated descendant diagnostic = $isolatedExecution",
              'full inspection_supervisor target = NOT RUN',
              'artifact upload = NOT RUN',
              'ARTIFACT_UPLOAD_COUNT = 0'
            )
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  first_rust:
    name: F3A First Rust-test Gate only
    if: inputs.desktop_inspection_only != true && github.event_name == 'workflow_dispatch' && inputs.first_rust_only == true && inputs.f3a_runtime_reproduction != true && inputs.f3a_runner_transport != true && inputs.f3a_source_identity_only != true
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      EVIDENCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact first-gate source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and assert pinned Windows Rust toolchain
        id: rust_setup
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = rustup target list --toolchain $env:RUSTUP_TOOLCHAIN --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($targets) -notcontains "x86_64-pc-windows-msvc") { throw "Pinned MSVC target is not installed" }
          $rustVersion = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustVersion.StartsWith("rustc 1.97.1 ")) { throw "Unexpected Rust version" }
          $cargoVersion = cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $cargoVersion.StartsWith("cargo 1.97.1 ")) { throw "Unexpected Cargo version" }
          $checkedOutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($checkedOutSha -ne $env:EVIDENCE_SHA) { throw "Checkout SHA differs from tested SHA" }
          "Tested SHA: $checkedOutSha"
          "Rust: $rustVersion"
          "Cargo: $cargoVersion"
          "Runner SHA-256: $((Get-FileHash -LiteralPath desktop\src\bin\shirushi-limited-canary.rs -Algorithm SHA256).Hash.ToLowerInvariant())"
          "Cargo.lock SHA-256: $((Get-FileHash -LiteralPath desktop\Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Fetch locked Rust dependencies for first gate
        id: cargo_fetch
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run deferred limited-runner Rust tests offline
        id: cargo_test
        shell: pwsh
        run: |
          cargo test --locked --offline --features manual-canary --bin shirushi-limited-canary --manifest-path desktop\Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record first-gate-only evidence
        if: always()
        shell: pwsh
        run: |
          $summary = @(
            "# F3A First Rust-test Gate only",
            "Tested SHA: $env:EVIDENCE_SHA",
            "Checkout: ${{ steps.checkout.outcome }}",
            "Pinned Rust setup: ${{ steps.rust_setup.outcome }}",
            "Locked Rust fetch: ${{ steps.cargo_fetch.outcome }}",
            "Deferred Rust tests: ${{ steps.cargo_test.outcome }}",
            "Runtime construction, package generation and artifact upload: NOT RUN",
            "This first gate does not run or replace the normal F2C verification mode.",
            "Owner Review STOP after PASS or FAIL. Full F3A: NOT READY."
          )
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  f3a_runtime:
    name: F3A independent Candidate B runtime reproduction
    if: inputs.desktop_inspection_only != true && github.event_name == 'workflow_dispatch' && inputs.f3a_runtime_reproduction == true && inputs.f3a_runner_transport != true && inputs.f3a_source_identity_only != true
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      EVIDENCE_SHA: ${{ github.sha }}
    steps:
      - name: Assert exclusive proof mode
        id: mode
        shell: pwsh
        run: |
          if ("${{ inputs.first_rust_only }}" -eq "true") { throw "Select exactly one bounded F3A mode" }

      - name: Check out exact reproduction source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up approved CPython 3.12.10 x64
        id: python_setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Create isolated build-only pip 25.0.1 environment
        id: build_environment
        shell: pwsh
        run: |
          $basePython = "${{ steps.python_setup.outputs.python-path }}"
          if (-not [IO.Path]::IsPathFullyQualified($basePython)) { throw "Explicit Python identity required" }
          & $basePython -I -B -c "import platform,struct; assert platform.python_implementation() == 'CPython' and platform.python_version() == '3.12.10' and struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gateRoot = Join-Path $env:RUNNER_TEMP "f3a-runtime-reproduction"
          if (Test-Path -LiteralPath $gateRoot) { throw "Gate workspace is not fresh" }
          New-Item -ItemType Directory -Path $gateRoot -ErrorAction Stop | Out-Null
          $toolVenv = Join-Path $gateRoot "build-tools"
          & $basePython -I -B -m venv $toolVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolPython = Join-Path $toolVenv "Scripts\python.exe"
          & $toolPython -I -B -c "import pip; assert pip.__version__ == '25.0.1'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "F3A_TOOL_PYTHON=$toolPython" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "F3A_GATE_ROOT=$gateRoot" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'f3a-runtime-target')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceSha -ne $env:EVIDENCE_SHA) { throw "Tested source SHA mismatch" }
          "Tested SHA: $sourceSha; CPython 3.12.10 x64; build-only pip 25.0.1"

      - name: Acquire only four approved immutable wheels and verify hashes
        id: inputs
        shell: pwsh
        run: |
          & $env:F3A_TOOL_PYTHON -I -B -S scripts\verify_f3a_ci_runtime.py fetch --wheelhouse (Join-Path $env:F3A_GATE_ROOT "wheelhouse") --evidence (Join-Path $env:F3A_GATE_ROOT "inputs.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Construct new Candidate B with standard offline resolver and install
        id: runtime
        shell: pwsh
        run: |
          & $env:F3A_TOOL_PYTHON -I -B scripts\prepare_f3a_limited_runtime.py --python $env:F3A_TOOL_PYTHON --wheelhouse (Join-Path $env:F3A_GATE_ROOT "wheelhouse") --output (Join-Path $env:F3A_GATE_ROOT "runtime") --evidence (Join-Path $env:F3A_GATE_ROOT "runtime-evidence.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run existing Python baseline and reproduction boundary tests
        id: python_tests
        shell: pwsh
        run: |
          $site = Join-Path $env:F3A_GATE_ROOT "runtime\site-packages"
          & $env:F3A_TOOL_PYTHON -I -B -c "import sys,unittest; sys.path[:0]=[sys.argv[1],sys.argv[2]]; s=unittest.defaultTestLoader.loadTestsFromNames(['tests.test_prepare_f3a_limited_runtime','tests.test_inspect_limited_entry','tests.test_inspection_metadata','tests.test_f3a_ci_runtime','tests.test_f2c1_ci_verification']); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful())" $site $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:F3A_TOOL_PYTHON -I -B scripts\verify_f2c1_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and assert existing pinned Rust toolchain
        id: rust_setup
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = rustup target list --toolchain $env:RUSTUP_TOOLCHAIN --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($targets) -notcontains "x86_64-pc-windows-msvc") { throw "Pinned MSVC target missing" }
          $rustVersion = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustVersion.StartsWith("rustc 1.97.1 ")) { throw "Unexpected Rust version" }
          $cargoVersion = cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $cargoVersion.StartsWith("cargo 1.97.1 ")) { throw "Unexpected Cargo version" }

      - name: Fetch unchanged locked Rust build inputs
        id: cargo_fetch
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all 19 limited-runner Rust tests including real Job cleanup
        id: cargo_test
        shell: pwsh
        run: |
          cargo test --locked --offline --features manual-canary --bin shirushi-limited-canary --manifest-path desktop\Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build only the existing limited native runner offline
        id: runner_build
        shell: pwsh
        run: |
          cargo build --locked --offline --features manual-canary --bin shirushi-limited-canary --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble ephemeral Candidate B inspection test tree without archive
        id: assemble
        shell: pwsh
        run: |
          & $env:F3A_TOOL_PYTHON -I -B -S scripts\verify_f3a_ci_runtime.py assemble --runtime (Join-Path $env:F3A_GATE_ROOT "runtime") --runtime-evidence (Join-Path $env:F3A_GATE_ROOT "runtime-evidence.json") --runner (Join-Path $env:CARGO_TARGET_DIR "debug\shirushi-limited-canary.exe") --output (Join-Path $env:F3A_GATE_ROOT "candidate-b") --evidence (Join-Path $env:F3A_GATE_ROOT "assembly.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove native Prepare seal reuse limited inspection exit and Job empty
        id: native_proof
        shell: pwsh
        run: |
          $basePython = "${{ steps.python_setup.outputs.python-path }}"
          & $env:F3A_TOOL_PYTHON -I -B -S scripts\verify_f3a_ci_runtime.py prove --package (Join-Path $env:F3A_GATE_ROOT "candidate-b") --python $basePython --negatives-root (Join-Path $env:F3A_GATE_ROOT "negative-copies") --evidence (Join-Path $env:F3A_GATE_ROOT "native-proof.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record bounded CI-only evidence without runtime upload
        if: always()
        shell: pwsh
        run: |
          if ($env:F3A_GATE_ROOT) {
            foreach ($name in @("inputs.json", "runtime-evidence.json", "assembly.json", "native-proof.json")) {
              $evidence = Join-Path $env:F3A_GATE_ROOT $name
              if (Test-Path -LiteralPath $evidence -PathType Leaf) {
                if ((Get-Item -LiteralPath $evidence).Length -gt 262144) { throw "Evidence exceeds bounded log size" }
                "CI evidence: $name"
                Get-Content -LiteralPath $evidence -Raw
              }
            }
          }
          @(
            "# F3A independent Candidate B CI proof",
            "Tested SHA: $env:EVIDENCE_SHA",
            "Inputs: ${{ steps.inputs.outcome }}; offline runtime: ${{ steps.runtime.outcome }}",
            "Python tests: ${{ steps.python_tests.outcome }}; Rust 19 tests: ${{ steps.cargo_test.outcome }}",
            "Runner build: ${{ steps.runner_build.outcome }}; ephemeral assembly: ${{ steps.assemble.outcome }}",
            "Native Prepare/seal/limited inspection/cleanup: ${{ steps.native_proof.outcome }}",
            "Candidate A is local-only and unchanged. Whole-environment A/B byte equality is not required or claimed.",
            "cffi launcher: PRESENT_UNUSED_PENDING_DISTRIBUTION_REVIEW. pyo3-ffi: PARTIAL / ATTRIBUTION_UNRESOLVED.",
            "No runtime archive or upload. Distribution Compliance NOT READY. Full F3A NOT READY. Owner Review STOP."
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  f3a_runner_transport:
    name: F3A development runner-only transport
    if: inputs.desktop_inspection_only != true && github.event_name == 'workflow_dispatch' && inputs.f3a_runner_transport == true && inputs.f3a_source_identity_only != true
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
      APPROVED_SOURCE_SHA: 6f015ef00fa929dfc9f3c85d8f4b699c6ec6f205
      APPROVED_RUNNER_SHA256: 6d6bef9cb9563f611e243f3bfd028b75fad9c9b55178add85190b3d602c5d93a
      APPROVED_LOCK_SHA256: d628a85387556da8542551fad508f0f7bd4b92f570e49e7b035f3f765ddc5069
      APPROVED_RUNNER_BLOB_OID: 6f6731d3c50d53068b5fa20e45b16b4967ef4bb7
      APPROVED_LOCK_BLOB_OID: cbfdaabcaea09497feba169e934af93941678c3e
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Reject conflicting transport modes
        shell: pwsh
        run: |
          if ("${{ inputs.first_rust_only }}" -eq "true" -or "${{ inputs.f3a_runtime_reproduction }}" -eq "true") {
            throw "Select exactly one bounded F3A mode"
          }

      - name: Check out immutable approved runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          # Step-scoped Git configuration: affects only this isolated CI checkout.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          persist-credentials: false

      - name: Assert source identities and pinned Windows Rust toolchain
        id: identity
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --local core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceSha -ne $env:APPROVED_SOURCE_SHA) { throw "Approved source revision mismatch" }
          function Read-CanonicalBlob([string]$oid) {
            if ($oid -notmatch '^[0-9a-f]{40}$') { throw "Unexpected source blob OID" }
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = 'git'
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($arg in @('cat-file', 'blob', $oid)) { $start.ArgumentList.Add($arg) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            $buffer = [IO.MemoryStream]::new()
            try {
              if (-not $process.Start()) { throw "Canonical blob reader did not start" }
              $errorRead = $process.StandardError.ReadToEndAsync()
              $process.StandardOutput.BaseStream.CopyTo($buffer)
              $process.WaitForExit()
              $null = $errorRead.GetAwaiter().GetResult()
              if ($process.ExitCode -ne 0) { throw "Canonical blob reader failed" }
              return ,$buffer.ToArray()
            } finally { $buffer.Dispose(); $process.Dispose() }
          }
          $sources = @(
            @{ path = 'desktop/Cargo.lock'; oid = $env:APPROVED_LOCK_BLOB_OID; sha256 = $env:APPROVED_LOCK_SHA256 },
            @{ path = 'desktop/src/bin/shirushi-limited-canary.rs'; oid = $env:APPROVED_RUNNER_BLOB_OID; sha256 = $env:APPROVED_RUNNER_SHA256 }
          )
          foreach ($source in $sources) {
            $oid = git rev-parse "${sourceSha}:$($source.path)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($oid -ne $source.oid) { throw "Approved source blob OID mismatch" }
            [byte[]]$blob = Read-CanonicalBlob $oid
            [byte[]]$file = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $source.path))
            $blobHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($blob)).ToLowerInvariant()
            $fileHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($file)).ToLowerInvariant()
            if ($blobHash -ne $source.sha256 -or $fileHash -ne $source.sha256 -or $file.Length -ne $blob.Length) { throw "Canonical raw blob/build-tree bytes mismatch" }
            for ($i = 0; $i -lt $blob.Length; $i++) { if ($blob[$i] -ne $file[$i]) { throw "Build-tree byte differs from canonical blob" } }
            "CANONICAL_SOURCE_OK: path=$($source.path) oid=$oid sha256=$blobHash bytes=$($blob.Length)"
          }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustVersion = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoVersion = cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustVersion.StartsWith("rustc 1.97.1 ") -or -not $cargoVersion.StartsWith("cargo 1.97.1 ")) { throw "Pinned toolchain mismatch" }
          $rustIdentity = @(rustc --version --verbose)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargoIdentity = @(cargo --version --verbose)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'f3a-runner-transport-target')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "F3A_RUNNER_TRANSPORT_DIR=$(Join-Path $env:RUNNER_TEMP 'f3a-runner-transport')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "rust_version=$rustVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "cargo_version=$cargoVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "rustc_identity_json=$(ConvertTo-Json -InputObject $rustIdentity -Compress)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "cargo_identity_json=$(ConvertTo-Json -InputObject $cargoIdentity -Compress)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Fetch only locked Rust build dependencies
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retest exact limited runner offline
        shell: pwsh
        run: |
          cargo test --locked --offline --features manual-canary --bin shirushi-limited-canary --manifest-path desktop\Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build only the existing debug limited runner offline
        shell: pwsh
        run: |
          cargo build --locked --offline --features manual-canary --bin shirushi-limited-canary --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create and independently audit exact two-file transport
        shell: pwsh
        run: |
          $runnerHash = (Get-FileHash -LiteralPath desktop\src\bin\shirushi-limited-canary.rs -Algorithm SHA256).Hash.ToLowerInvariant()
          $lockHash = (Get-FileHash -LiteralPath desktop\Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runnerHash -ne $env:APPROVED_RUNNER_SHA256 -or $lockHash -ne $env:APPROVED_LOCK_SHA256) { throw "Build changed approved source/lock" }
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runnerOid = git rev-parse "${sourceSha}:desktop/src/bin/shirushi-limited-canary.rs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lockOid = git rev-parse "${sourceSha}:desktop/Cargo.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceSha -ne $env:APPROVED_SOURCE_SHA -or $runnerOid -ne $env:APPROVED_RUNNER_BLOB_OID -or $lockOid -ne $env:APPROVED_LOCK_BLOB_OID) { throw "Build changed canonical Git identity" }
          if (Test-Path -LiteralPath $env:F3A_RUNNER_TRANSPORT_DIR) { throw "Transport destination already exists" }
          New-Item -ItemType Directory -Path $env:F3A_RUNNER_TRANSPORT_DIR | Out-Null
          $builtExe = Join-Path $env:CARGO_TARGET_DIR 'debug/shirushi-limited-canary.exe'
          $stagedExe = Join-Path $env:F3A_RUNNER_TRANSPORT_DIR 'shirushi-limited-canary.exe'
          Copy-Item -LiteralPath $builtExe -Destination $stagedExe
          $builtHash = (Get-FileHash -LiteralPath $builtExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeInfo = Get-Item -LiteralPath $stagedExe
          $exeHash = (Get-FileHash -LiteralPath $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -ne $builtHash -or $exeInfo.Length -le 0) { throw "Runner transport copy mismatch" }
          $evidence = [ordered]@{
            evidence_version = 1
            purpose = 'DEVELOPMENT_RUNNER_TRANSPORT_ONLY'
            repository = 'shota0e0/shirushi'
            source_commit = $env:APPROVED_SOURCE_SHA
            workflow_commit = $env:WORKFLOW_SHA
            workflow_run_id = '${{ github.run_id }}'
            workflow_run_attempt = '${{ github.run_attempt }}'
            workflow_run_url = 'https://github.com/shota0e0/shirushi/actions/runs/${{ github.run_id }}'
            source_identity = 'EXACT_COMMIT_GIT_BLOB_OID_RAW_SHA256'
            runner_source_blob_oid = $runnerOid
            runner_source_sha256 = $env:APPROVED_RUNNER_SHA256
            cargo_lock_blob_oid = $lockOid
            cargo_lock_sha256 = $env:APPROVED_LOCK_SHA256
            build_tree_matches_raw_blobs = $true
            rust_version = '${{ steps.identity.outputs.rust_version }}'
            cargo_version = '${{ steps.identity.outputs.cargo_version }}'
            rustc_identity = ('${{ steps.identity.outputs.rustc_identity_json }}' | ConvertFrom-Json)
            cargo_identity = ('${{ steps.identity.outputs.cargo_identity_json }}' | ConvertFrom-Json)
            target = 'x86_64-pc-windows-msvc'
            profile = 'debug'
            features = @('manual-canary')
            rust_tests = 'PASS'
            runner_execution = 'NOT_RUN'
            files = @([ordered]@{ path = 'shirushi-limited-canary.exe'; bytes = $exeInfo.Length; sha256 = $exeHash })
            distribution_compliance = 'NOT_READY'
            full_f3a = 'NOT_READY'
          }
          $evidencePath = Join-Path $env:F3A_RUNNER_TRANSPORT_DIR 'runner-evidence.json'
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8NoBOM
          $items = @(Get-ChildItem -LiteralPath $env:F3A_RUNNER_TRANSPORT_DIR -Force -Recurse)
          $expected = @('runner-evidence.json', 'shirushi-limited-canary.exe')
          if ($items.Count -ne 2 -or @($items | Where-Object { $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $_.Name -notin $expected }).Count -ne 0) { throw "Unexpected transport file/link/directory" }
          if (@(Compare-Object $expected @($items.Name)).Count -ne 0) { throw "Transport exact file set mismatch" }
          $readback = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($readback.source_commit -ne $env:APPROVED_SOURCE_SHA -or $readback.cargo_lock_blob_oid -ne $env:APPROVED_LOCK_BLOB_OID -or $readback.cargo_lock_sha256 -ne $env:APPROVED_LOCK_SHA256 -or $readback.runner_source_blob_oid -ne $env:APPROVED_RUNNER_BLOB_OID -or $readback.runner_source_sha256 -ne $env:APPROVED_RUNNER_SHA256 -or $readback.workflow_run_id -ne '${{ github.run_id }}' -or $readback.files.Count -ne 1 -or $readback.files[0].path -ne 'shirushi-limited-canary.exe' -or $readback.files[0].bytes -ne (Get-Item -LiteralPath $stagedExe).Length -or $readback.files[0].sha256 -ne (Get-FileHash -LiteralPath $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant()) { throw "Evidence readback mismatch" }
          $evidenceHash = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "TRANSPORT_AUDIT_OK: files=2 runtime_upload_count=0 runner_bytes=$($exeInfo.Length) runner_sha256=$exeHash evidence_sha256=$evidenceHash"
          "TRANSPORT_INVENTORY: runner-evidence.json,shirushi-limited-canary.exe"
          "RUNNER_EVIDENCE: $(ConvertTo-Json -InputObject $readback -Depth 5 -Compress)"
          @("# Development runner transport only", "Approved source: $env:APPROVED_SOURCE_SHA", "Workflow revision: $env:WORKFLOW_SHA", "Runner SHA-256: $exeHash", "Evidence SHA-256: $evidenceHash", "Exact files: 2; no runtime/wheels/Mark/seal/acquisition/local inputs", "No native Prepare, seal, inspection or runner execution. Distribution Compliance NOT READY; Full F3A NOT READY.") | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload ONLY development runner and sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: DEVELOPMENT-RUNNER-TRANSPORT-${{ github.run_id }}
          path: |
            ${{ env.F3A_RUNNER_TRANSPORT_DIR }}/shirushi-limited-canary.exe
            ${{ env.F3A_RUNNER_TRANSPORT_DIR }}/runner-evidence.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          overwrite: false

  f3a_source_identity:
    name: F3A source byte identity diagnostics ONLY
    if: inputs.desktop_inspection_only != true && github.event_name == 'workflow_dispatch' && inputs.f3a_source_identity_only == true
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      APPROVED_SOURCE_SHA: 0bea483d650cf89716ace0bd0589c60e7eb14b56
      APPROVED_RUNNER_SHA256: 9482fe89345af3d8b856131cac84668536e0efef938ab8acfc98640f7f0aab1b
      APPROVED_LOCK_SHA256: e9c45a2ec307189e0cab2af7712244f9bd2353e1389e5b6dc608fcd9aeb4f4fc
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Reject non-diagnostic mode flags
        shell: pwsh
        run: |
          if ("${{ inputs.first_rust_only }}" -eq "true" -or "${{ inputs.f3a_runtime_reproduction }}" -eq "true" -or "${{ inputs.f3a_runner_transport }}" -eq "true") {
            throw "Source identity diagnostics cannot run another mode"
          }

      - name: Reproduce the exact prior runner checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
          persist-credentials: false

      - name: Report raw blob and checkout identities without changing bytes
        shell: pwsh
        run: |
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceSha -ne $env:APPROVED_SOURCE_SHA) { throw "Approved source revision mismatch" }
          function Read-RawGitBlob([string]$oid) {
            if ($oid -notmatch '^[0-9a-f]{40}$') { throw "Unexpected blob OID" }
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = 'git'
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($arg in @('cat-file', 'blob', $oid)) { $start.ArgumentList.Add($arg) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            $buffer = [IO.MemoryStream]::new()
            try {
              if (-not $process.Start()) { throw "Git blob reader did not start" }
              $errorRead = $process.StandardError.ReadToEndAsync()
              $process.StandardOutput.BaseStream.CopyTo($buffer)
              $process.WaitForExit()
              $null = $errorRead.GetAwaiter().GetResult()
              if ($process.ExitCode -ne 0) { throw "Git blob reader failed" }
              return ,$buffer.ToArray()
            } finally { $buffer.Dispose(); $process.Dispose() }
          }
          function Measure-Bytes([byte[]]$bytes) {
            $lf = 0; $crlf = 0; $cr = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) { $lf++; if ($i -gt 0 -and $bytes[$i - 1] -eq 13) { $crlf++ } }
              if ($bytes[$i] -eq 13) { $cr++ }
            }
            $bareLf = $lf - $crlf; $loneCr = $cr - $crlf
            $eol = if ($lf -eq 0 -and $cr -eq 0) { 'NONE' } elseif ($crlf -gt 0 -and $bareLf -eq 0 -and $loneCr -eq 0) { 'CRLF' } elseif ($bareLf -gt 0 -and $cr -eq 0) { 'LF' } else { 'MIXED' }
            return [ordered]@{ sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant(); bytes = $bytes.Length; eol = $eol; lf_count = $lf; crlf_count = $crlf; bare_lf_count = $bareLf; lone_cr_count = $loneCr }
          }
          function Equal-RawBytes([byte[]]$left, [byte[]]$right) {
            if ($left.Length -ne $right.Length) { return $false }
            for ($i = 0; $i -lt $left.Length; $i++) { if ($left[$i] -ne $right[$i]) { return $false } }
            return $true
          }
          function Equal-ExceptEol([byte[]]$left, [byte[]]$right) {
            # Diagnostic comparison AFTER raw hashes. No normalized bytes are hashed or accepted.
            $i = 0; $j = 0
            while ($i -lt $left.Length -and $j -lt $right.Length) {
              if ($left[$i] -eq 13 -and $i + 1 -lt $left.Length -and $left[$i + 1] -eq 10) { $i++ }
              if ($right[$j] -eq 13 -and $j + 1 -lt $right.Length -and $right[$j + 1] -eq 10) { $j++ }
              if ($left[$i] -ne $right[$j]) { return $false }
              $i++; $j++
            }
            return ($i -eq $left.Length -and $j -eq $right.Length)
          }
          $paths = @('desktop/Cargo.lock', 'desktop/src/bin/shirushi-limited-canary.rs')
          $expected = @{ 'desktop/Cargo.lock' = $env:APPROVED_LOCK_SHA256; 'desktop/src/bin/shirushi-limited-canary.rs' = $env:APPROVED_RUNNER_SHA256 }
          $rows = @()
          foreach ($path in $paths) {
            $oid = git rev-parse "${sourceSha}:$path"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $objectType = git cat-file -t $oid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($objectType -ne 'blob') { throw "Expected Git blob object" }
            [byte[]]$blobBytes = Read-RawGitBlob $oid
            [byte[]]$checkoutBytes = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $path))
            $blobFacts = Measure-Bytes $blobBytes
            $checkoutFacts = Measure-Bytes $checkoutBytes
            $eolListing = git ls-files --eol -- $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $attributes = @(git check-attr text eol working-tree-encoding -- $path)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $rows += [ordered]@{ path = $path; source_commit = $sourceSha; blob_oid = $oid; git_blob = $blobFacts; ci_checkout = $checkoutFacts; approved_gate_sha256 = $expected[$path]; checkout_matches_approved = ($checkoutFacts.sha256 -eq $expected[$path]); blob_checkout_raw_equal = (Equal-RawBytes $blobBytes $checkoutBytes); content_equal_except_eol = (Equal-ExceptEol $blobBytes $checkoutBytes); eol_listing = $eolListing; attributes = $attributes }
          }
          $config = [ordered]@{}
          foreach ($key in @('core.autocrlf', 'core.eol', 'core.safecrlf')) {
            $value = git config --get $key
            if ($LASTEXITCODE -gt 1) { throw "Git EOL configuration query failed" }
            $config[$key] = if ($LASTEXITCODE -eq 1) { 'UNSET' } else { "$value" }
          }
          $gitVersion = git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = [ordered]@{ purpose = 'SOURCE_BYTE_IDENTITY_DIAGNOSTIC_ONLY'; prior_run = 36670510833; workflow_commit = $env:WORKFLOW_SHA; source_commit = $sourceSha; git_version = $gitVersion; hosted_image_os = $env:ImageOS; hosted_image_version = $env:ImageVersion; git_eol_configuration = $config; paths = $rows; build = 'NOT_RUN'; upload = 'NOT_RUN'; approved_hashes = 'UNCHANGED' }
          'SOURCE_BYTE_IDENTITY_JSON_BEGIN'
          $report | ConvertTo-Json -Depth 8
          'SOURCE_BYTE_IDENTITY_JSON_END'
          # A diagnostic reports mismatches; it never authorizes a build or accepts new hashes.

  verify:
    name: Frozen F2C.1 source verification
    if: inputs.desktop_inspection_only != true && inputs.f3a_runtime_reproduction != true && inputs.first_rust_only != true && inputs.f3a_runner_transport != true && inputs.f3a_source_identity_only != true && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.97.1-x86_64-pc-windows-msvc
    steps:
      - name: Check out exact source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10 x64
        id: python_setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Set up Node 24.18.0
        id: node_setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        id: rust_setup
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = rustup target list --toolchain $env:RUSTUP_TOOLCHAIN --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($targets) -notcontains "x86_64-pc-windows-msvc") { throw "Pinned MSVC target is not installed" }
          $targets

      - name: Assert and record tool versions
        id: versions
        shell: pwsh
        run: |
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonVersion -ne "3.12.10") { throw "Unexpected Python version: $pythonVersion" }
          $pythonBits = python -c "import struct; print(struct.calcsize('P') * 8)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($pythonBits -ne "64") { throw "Python is not x64" }
          $nodeVersion = node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($nodeVersion -ne "v24.18.0") { throw "Unexpected Node version: $nodeVersion" }
          $nodeArch = node -p "process.arch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($nodeArch -ne "x64") { throw "Node is not x64" }
          $rustVersion = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustVersion.StartsWith("rustc 1.97.1 ")) { throw "Unexpected rustc version: $rustVersion" }
          $cargoVersion = cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $cargoVersion.StartsWith("cargo 1.97.1 ")) { throw "Unexpected cargo version: $cargoVersion" }
          "Python: $pythonVersion ($pythonBits-bit)"
          "Node: $nodeVersion ($nodeArch)"
          "Rust: $rustVersion"
          "Cargo: $cargoVersion"

      - name: Create fixed Python virtual environment
        id: venv
        shell: pwsh
        run: |
          python -m venv .venv-py312
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-py312\Scripts\python.exe -c "import platform; assert platform.python_version() == '3.12.10'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit source and resources before build
        id: pre_audit
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe scripts\verify_f2c1_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run bounded Python bridge and Personal Mark suites
        id: python_tests
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe -m unittest -q tests.test_desktop_bridge tests.test_personal_mark tests.test_personal_mark_motion tests.test_personal_mark_v2 tests.test_personal_mark_v2_store tests.test_personal_mark_snapshot tests.test_personal_mark_unicode16 tests.test_personal_mark_v2_cross_language
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CI verification and public asset governance tests
        id: ci_audit_tests
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe -m unittest -q tests.test_f2c1_ci_verification tests.test_public_fixture_governance tests.test_f2c6_canary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DEVELOPMENT CANARY launcher tests
        id: canary_launcher_tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests\test_f2c6_launcher.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run all Web verification commands
        id: web_tests
        shell: pwsh
        run: |
          node web\verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web\desktop\verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web\personal-mark-v2\verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web\personal-mark-v2\unicode16.verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node web-canary\verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch locked Rust dependencies
        id: cargo_fetch
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record locked Windows dependency metadata
        id: canary_metadata
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "f2c6-cargo-metadata.json"
          if (Test-Path -LiteralPath $metadataPath) { throw "Cargo metadata output is not fresh" }
          $metadata = cargo metadata --locked --offline --features manual-canary --filter-platform x86_64-pc-windows-msvc --format-version 1 --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText($metadataPath, ($metadata -join [Environment]::NewLine), [Text.UTF8Encoding]::new($false))

      - name: Preflight resolved dependency license texts
        id: canary_license_preflight
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "f2c6-cargo-metadata.json"
          .\.venv-py312\Scripts\python.exe scripts\package_f2c6_canary.py preflight-licenses --source-root $PWD.Path --cargo-metadata $metadataPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native bridge offline
        id: cargo_test
        shell: pwsh
        run: |
          cargo test --locked --offline --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build debug desktop executable offline without launching
        id: cargo_build
        shell: pwsh
        run: |
          cargo build --locked --offline --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit staged assets after build
        id: post_audit
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe scripts\verify_f2c1_ci.py --staged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify debug executable exists without launching it
        id: exe_exists
        shell: pwsh
        run: |
          $item = Get-Item -LiteralPath desktop\target\debug\shirushi-desktop.exe -ErrorAction Stop
          if (-not $item.PSIsContainer -and $item.Length -gt 0) { "Verified file: $($item.FullName) ($($item.Length) bytes)" } else { throw "Debug executable is missing or invalid" }

      - name: Test debug-only manual canary feature offline in isolated target
        id: canary_cargo_test
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "f2c6-canary-target"
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) { throw "Canary target directory is not fresh" }
          cargo test --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native DEVELOPMENT CANARY runner offline
        id: canary_runner_tests
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "f2c6-canary-target"
          cargo test --locked --offline --features manual-canary --bin shirushi-canary-runner --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build debug-only manual canary executable offline without launching
        id: canary_cargo_build
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "f2c6-canary-target"
          cargo build --locked --offline --features manual-canary --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $item = Get-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "debug\shirushi-desktop.exe") -ErrorAction Stop
          if ($item.PSIsContainer -or $item.Length -le 0) { throw "Manual canary executable is missing or invalid" }
          "Verified feature executable without launching: $($item.FullName) ($($item.Length) bytes)"

      - name: Build native DEVELOPMENT CANARY runner offline
        id: canary_runner_build
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "f2c6-canary-target"
          cargo build --locked --offline --features manual-canary --bin shirushi-canary-runner --manifest-path desktop\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $item = Get-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "debug\shirushi-canary-runner.exe") -ErrorAction Stop
          if ($item.PSIsContainer -or $item.Length -le 0) { throw "Native runner executable is missing or invalid" }
          "Verified DEVELOPMENT CANARY runner without launching: $($item.FullName) ($($item.Length) bytes)"

      - name: Re-audit generated assets after manual canary build
        id: canary_post_audit
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe scripts\verify_f2c1_ci.py --staged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create audited DEVELOPMENT CANARY package
        id: package_canary
        env:
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_EVENT: ${{ github.event_name }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP "f2c6-canary-target"
          $artifactDir = Join-Path $env:RUNNER_TEMP "shirushi-DEVELOPMENT-CANARY-windows-x64-$env:EVIDENCE_SHA"
          $metadataPath = Join-Path $env:RUNNER_TEMP "f2c6-cargo-metadata.json"
          $rustSysroot = rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustLibraryNotice = Join-Path $rustSysroot "share\doc\rust\COPYRIGHT-library.html"
          $noticeItem = Get-Item -LiteralPath $rustLibraryNotice -ErrorAction Stop
          if ($noticeItem.PSIsContainer -or $noticeItem.Length -le 0) { throw "Rust library notice is missing or invalid" }
          $arguments = @(
            "scripts\package_f2c6_canary.py", "create",
            "--source-root", $PWD.Path,
            "--executable", (Join-Path $targetDir "debug\shirushi-desktop.exe"),
            "--runner-executable", (Join-Path $targetDir "debug\shirushi-canary-runner.exe"),
            "--output", $artifactDir,
            "--cargo-metadata", $metadataPath,
            "--rust-library-notice", $rustLibraryNotice,
            "--repository", $env:EVIDENCE_REPOSITORY,
            "--event-name", $env:EVIDENCE_EVENT,
            "--tested-sha", $env:EVIDENCE_SHA,
            "--head-sha", $env:EVIDENCE_HEAD_SHA
          )
          if ($env:EVIDENCE_BASE_SHA) { $arguments += @("--base-sha", $env:EVIDENCE_BASE_SHA) }
          & .\.venv-py312\Scripts\python.exe @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "artifact_dir=$artifactDir" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $manifestHash = (Get-FileHash -LiteralPath (Join-Path $artifactDir "manifest.json") -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath (Join-Path $artifactDir "shirushi-desktop.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          $runnerHash = (Get-FileHash -LiteralPath (Join-Path $artifactDir "shirushi-canary-runner.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          "DEVELOPMENT CANARY manifest SHA-256: $manifestHash"
          "DEVELOPMENT CANARY executable SHA-256: $exeHash"
          "DEVELOPMENT CANARY runner SHA-256: $runnerHash"

      - name: Independently re-audit DEVELOPMENT CANARY package
        id: audit_canary
        shell: pwsh
        run: |
          .\.venv-py312\Scripts\python.exe scripts\package_f2c6_canary.py audit --package-dir "${{ steps.package_canary.outputs.artifact_dir }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare PowerShell reference and native runner Prepare boundaries
        id: canary_equivalence
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          pwsh -NoProfile -File tests\test_f2c7_equivalence.ps1 -PackageDir "${{ steps.package_canary.outputs.artifact_dir }}" -PythonPath $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload DEVELOPMENT CANARY package
        id: upload_canary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: shirushi-DEVELOPMENT-CANARY-windows-x64-${{ github.sha }}
          path: ${{ steps.package_canary.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

      - name: Record CI-only evidence and unresolved gates
        if: always()
        env:
          EVIDENCE_EVENT: ${{ github.event_name }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $summary = @(
            "# F2C.1 Windows verification",
            "",
            "Event: $env:EVIDENCE_EVENT",
            "Tested SHA (PR merge SHA for pull_request): $env:EVIDENCE_SHA",
            "PR head SHA: $env:EVIDENCE_HEAD_SHA",
            "PR base SHA: $env:EVIDENCE_BASE_SHA",
            "Run: $env:EVIDENCE_RUN_URL",
            "",
            "| Step | Outcome |",
            "| --- | --- |",
            "| Checkout | ${{ steps.checkout.outcome }} |",
            "| Python setup | ${{ steps.python_setup.outcome }} |",
            "| Node setup | ${{ steps.node_setup.outcome }} |",
            "| Rust toolchain setup | ${{ steps.rust_setup.outcome }} |",
            "| Version assertions | ${{ steps.versions.outcome }} |",
            "| Python venv | ${{ steps.venv.outcome }} |",
            "| Pre-build source/resource audit | ${{ steps.pre_audit.outcome }} |",
            "| Bounded Python suites | ${{ steps.python_tests.outcome }} |",
            "| CI audit and public asset governance | ${{ steps.ci_audit_tests.outcome }} |",
            "| DEVELOPMENT CANARY launcher tests | ${{ steps.canary_launcher_tests.outcome }} |",
            "| Web verification | ${{ steps.web_tests.outcome }} |",
            "| Cargo fetch | ${{ steps.cargo_fetch.outcome }} |",
            "| Locked Windows dependency metadata | ${{ steps.canary_metadata.outcome }} |",
            "| Dependency license-text preflight | ${{ steps.canary_license_preflight.outcome }} |",
            "| Cargo test | ${{ steps.cargo_test.outcome }} |",
            "| Cargo debug build | ${{ steps.cargo_build.outcome }} |",
            "| Post-build staged-asset audit | ${{ steps.post_audit.outcome }} |",
            "| Debug executable existence only | ${{ steps.exe_exists.outcome }} |",
            "| Manual-canary feature test (isolated target) | ${{ steps.canary_cargo_test.outcome }} |",
            "| Native runner tests | ${{ steps.canary_runner_tests.outcome }} |",
            "| Manual-canary feature build (isolated target) | ${{ steps.canary_cargo_build.outcome }} |",
            "| Native runner build | ${{ steps.canary_runner_build.outcome }} |",
            "| Manual-canary staged-asset re-audit | ${{ steps.canary_post_audit.outcome }} |",
            "| DEVELOPMENT CANARY package creation | ${{ steps.package_canary.outcome }} |",
            "| DEVELOPMENT CANARY independent package audit | ${{ steps.audit_canary.outcome }} |",
            "| PowerShell/native Prepare equivalence | ${{ steps.canary_equivalence.outcome }} |",
            "| DEVELOPMENT CANARY artifact upload | ${{ steps.upload_canary.outcome }} |",
            "",
            "DEVELOPMENT CANARY artifact ID: ${{ steps.upload_canary.outputs.artifact-id }}",
            "DEVELOPMENT CANARY artifact digest: ${{ steps.upload_canary.outputs.artifact-digest }}",
            "DEVELOPMENT CANARY artifact URL: ${{ steps.upload_canary.outputs.artifact-url }}",
            "Retention: 7 days. This unsigned debug package is not an installer or release.",
            "",
            "This is CI-only evidence. A skipped or failed step is not a PASS.",
            "Legacy Tk integration: **2 EXCLUDED / PENDING**; exact IDs and internal verification command are in docs/development/f2c-verification.md.",
            "The 13 motion-domain tests remain included. This bounded public-source suite is not full legacy Python regression.",
            "Full Python regression: **NOT RUN by this workflow**.",
            "All local native build, test, launch, UI, and sidecar lifecycle evidence: **PENDING**.",
            "G2: **NOT READY**, even if every CI step succeeds."
          )
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
