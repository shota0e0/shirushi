[package]
name = "shirushi-desktop"
version = "0.2.0"
description = "Local-development Shirushi desktop bridge canary"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "shirushi_desktop"
path = "src/lib.rs"

[[bin]]
name = "shirushi-desktop"
path = "src/main.rs"

[features]
default = []
manual-canary = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
crossbeam-channel = "=0.5.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
