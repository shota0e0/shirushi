[package]
name = "shirushi-f3a-rust-sdk-parity"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
c2pa = { version = "=0.85.0", default-features = false, features = ["rust_native_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
