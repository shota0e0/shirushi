<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <title>Shirushi — Visual Direction Canary</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./editorial.css" />
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#main" aria-label="Shirushi">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>
            <strong>Shirushi</strong>
            <small>しるし</small>
          </span>
        </a>

        <div class="header-actions">
          <label class="language-control">
            <span class="sr-only" data-i18n="languageLabel"></span>
            <select id="languageSelect" data-i18n-aria="languageLabel">
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-TW">繁體中文</option>
              <option value="ko">한국어</option>
            </select>
          </label>
          <button class="icon-button" id="detailsButton" type="button" data-i18n-aria="detailsLabel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.3a3.3 3.3 0 1 0 0-6.6 3.3 3.3 0 0 0 0 6.6Z" />
              <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.7-1.3-1.8-3.1-2 .8c-.4-.3-.8-.6-1.3-.8L15.7 5h-3.5l-.3 2.2c-.5.2-.9.5-1.3.8l-2-.8-1.8 3.1 1.7 1.3a6 6 0 0 0 0 1.5l-1.7 1.3 1.8 3.1 2-.8c.4.3.8.6 1.3.8l.3 2.2h3.5l.3-2.2c.5-.2.9-.5 1.3-.8l2 .8 1.8-3.1-1.7-.9Z" />
            </svg>
          </button>
        </div>
      </header>

      <main id="main" class="workspace">
        <div class="intro">
          <p class="eyebrow" data-i18n="eyebrow"></p>
          <h1 data-i18n="headline"></h1>
        </div>

        <section class="image-workspace" aria-labelledby="imageHeading">
          <h2 class="sr-only" id="imageHeading" data-i18n="imageHeading"></h2>

          <div class="empty-stage" id="emptyStage">
            <div class="empty-art" aria-hidden="true">
              <svg viewBox="0 0 160 112">
                <rect x="13" y="11" width="134" height="90" rx="18" />
                <path d="m31 79 26-25 19 17 19-22 34 30" />
                <circle cx="111" cy="35" r="8" />
              </svg>
            </div>
            <div>
              <h2 data-i18n="emptyTitle"></h2>
              <p data-i18n="emptyBody"></p>
            </div>
            <div class="empty-actions">
              <button class="button button-primary" id="selectImageButton" type="button" data-i18n="selectImage"></button>
              <button class="button button-quiet" id="demoImageButton" type="button" data-i18n="useDemo"></button>
            </div>
          </div>

          <div class="selected-stage" id="selectedStage" hidden>
            <div class="image-surface" id="imageSurface">
              <img id="previewImage" alt="" />
              <div class="motion-layer" id="motionLayer" aria-hidden="true">
                <p class="motion-source" id="motionSource" hidden></p>
                <div class="motion-mark" id="motionMark"></div>
                <p class="motion-rights" id="motionRights"></p>
                <div class="motion-complete" id="motionComplete"></div>
              </div>
            </div>
            <div class="image-meta">
              <span id="imageName"></span>
              <button class="text-button" id="changeImageButton" type="button" data-i18n="changeImage"></button>
            </div>
          </div>

          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        </section>

        <section class="mark-summary" aria-labelledby="markHeading">
          <div class="mark-copy">
            <span class="section-label" id="markHeading" data-i18n="yourMark"></span>
            <div class="mark-preview" id="markPreview"></div>
          </div>
          <button class="text-button" id="editMarkButton" type="button" data-i18n="editMark"></button>
        </section>

        <section class="primary-actions" data-i18n-aria="actionsLabel">
          <button class="button button-primary add-button" id="addButton" type="button" disabled>
            <span class="button-spark" aria-hidden="true"></span>
            <span data-i18n="addMark"></span>
          </button>
          <button class="verify-button" id="verifyButton" type="button" data-i18n="verifyMark" disabled></button>
          <fieldset class="verify-fixture" id="verifyFixture" disabled>
            <legend data-i18n="verifyFixtureLabel"></legend>
            <label class="verify-choice">
              <input type="radio" name="verifySnapshotMode" value="typed" checked />
              <span data-i18n="storedTypedMark"></span>
            </label>
            <label class="verify-choice">
              <input type="radio" name="verifySnapshotMode" value="handwritten" />
              <span data-i18n="storedHandwrittenMark"></span>
            </label>
          </fieldset>
          <p class="status-line" id="statusLine" role="status" aria-live="polite"></p>
        </section>

        <div class="rights-intent">
          <span class="intent-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3.5 5.5 6v5.4c0 4.2 2.7 7.7 6.5 9.1 3.8-1.4 6.5-4.9 6.5-9.1V6L12 3.5Z" /><path d="m9.1 12 1.9 1.9 4-4" /></svg>
          </span>
          <span data-i18n="rightsIntent"></span>
        </div>
      </main>

      <footer class="canary-footer">
        <span data-i18n="canaryNote"></span>
      </footer>
    </div>

    <dialog class="dialog mark-dialog" id="markDialog">
      <form method="dialog" class="dialog-card" id="markForm">
        <div class="dialog-header">
          <div>
            <p class="eyebrow" data-i18n="markDialogEyebrow"></p>
            <h2 data-i18n="markDialogTitle"></h2>
          </div>
          <button class="icon-button close-button" value="cancel" data-dialog-close type="submit" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <div class="mark-tabs" role="tablist">
          <button type="button" role="tab" id="typedTab" aria-controls="typedPanel" data-mark-mode="typed" data-i18n="typedMark"></button>
          <button type="button" role="tab" id="handwrittenTab" aria-controls="handwrittenPanel" data-mark-mode="handwritten" data-i18n="handwrittenMark"></button>
        </div>

        <div class="mark-panel" id="typedPanel" role="tabpanel" aria-labelledby="typedTab">
          <label class="field-label" for="typedInput" data-i18n="displayName"></label>
          <input class="text-input" id="typedInput" type="text" maxlength="48" autocomplete="name" />
          <p class="field-help" data-i18n="typedHelp"></p>
          <div class="typed-sample" id="typedSample"></div>
        </div>

        <div class="mark-panel" id="handwrittenPanel" role="tabpanel" aria-labelledby="handwrittenTab" hidden>
          <p class="field-help" data-i18n="handwrittenHelp"></p>
          <div class="drawing-wrap">
            <canvas id="drawingCanvas" width="480" height="220"></canvas>
            <span class="drawing-hint" id="drawingHint" data-i18n="drawHere"></span>
          </div>
          <button class="text-button redraw-button" id="redrawButton" type="button" data-i18n="redraw"></button>
          <p class="identity-note" data-i18n="identityBoundary"></p>
        </div>

        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel" type="submit" data-i18n="cancel"></button>
          <button class="button button-primary" id="saveMarkButton" value="default" type="submit" data-i18n="saveMark"></button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog details-dialog" id="detailsDialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-header">
          <div>
            <p class="eyebrow" data-i18n="detailsEyebrow"></p>
            <h2 data-i18n="detailsTitle"></h2>
          </div>
          <button class="icon-button close-button" value="cancel" type="submit" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="details-list">
          <div>
            <span data-i18n="detailCoreLabel"></span>
            <strong data-i18n="detailCoreValue"></strong>
          </div>
          <div>
            <span data-i18n="detailPixelLabel"></span>
            <strong data-i18n="detailPixelValue"></strong>
          </div>
          <div>
            <span data-i18n="detailPrivacyLabel"></span>
            <strong data-i18n="detailPrivacyValue"></strong>
          </div>
        </div>
        <p class="details-footnote" data-i18n="detailsFootnote"></p>
        <div class="dialog-actions single-action">
          <button class="button button-primary" value="default" type="submit" data-i18n="done"></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
